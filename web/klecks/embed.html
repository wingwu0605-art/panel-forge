<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1b1f'/%3E%3Cpath d='M4 11 9 4l3 3-5 5z' fill='%23fff'/%3E%3C/svg%3E">
<title>Klecks · 绘制</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1b1f}
  #pf-load{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#c9c9cf;font:14px/1.6 ui-sans-serif,system-ui,'PingFang SC',sans-serif;
    background:#1b1b1f;z-index:9;
  }
  #pf-load.hide{display:none}

  /* 手机上 Klecks 自带的那条顶部操作行太高（一整块黑带），压扁一点；
     横向宽屏不动它（桌面/平板布局本来就宽裕）。 */
  @media (max-width:560px){
    .top-overlay{min-height:0 !important}
    .top-overlay--inner{padding-top:2px !important;padding-bottom:2px !important}
  }
</style>
<script type="module" src="./embed.js"></script>
</head>
<body>
<div id="pf-load">正在准备画笔…</div>
<script type="module">
/**
 * Klecks 的引导页（跑在同源 iframe 里，一个 iframe = 一个全新实例）
 *
 * 为什么是 iframe：
 *   1. Klecks 的 embed 是单实例、直接挂到 document.body 的全屏应用，关不掉也重建不了；
 *      每次绘制开一个新 iframe，等于每次都是干净的实例。
 *   2. 它自带一整套样式，放进 iframe 就不会污染主应用的设计系统。
 *   3. 同源 → 父页面直接调下面的函数，不需要设计 postMessage 协议。
 *
 * 父页面（web/paint-host.mjs）会：
 *   await iframe.contentWindow.__pfKlecksReady
 *   await iframe.contentWindow.__pfKlecksBoot({ width, height, baseUrl })
 *   const png = await iframe.contentWindow.__pfKlecksPng()
 */
const ready = () => new Promise((res, rej) => {
  const t0 = Date.now();
  (function poll() {
    if (window.Klecks) return res(window.Klecks);
    if (Date.now() - t0 > 25000) return rej(new Error('Klecks 加载超时（检查 web/klecks/embed.js 是否 404）'));
    setTimeout(poll, 40);
  })();
});

window.__pfKlecksReady = ready();

/**
 * 建实例。layer 顺序：纸（白底）→ 底稿（可选）→ 绘制。
 * - 白纸永远在最底下：没有底图时画布就是一张白纸，而不是透明棋盘格
 *   （以前没底图就是透明的，画起来像在虚空里画，也别指望导出能直接用）
 * - 笔迹和底稿分开，撤销才不会把底稿一起擦掉
 * - 关掉白纸（透明底）：传 paper: false
 */
window.__pfKlecksBoot = async ({ width, height, baseUrl = '', baseLayerName = '底稿', paper = true, guide = null } = {}) => {
  await ready();
  if (window.__pfKlecks) throw new Error('这一份文档已经建过实例了');
  const layers = [];
  if (paper) {
    const sheet = document.createElement('canvas');
    sheet.width = Math.max(1, width);
    sheet.height = Math.max(1, height);
    const sg = sheet.getContext('2d');
    sg.fillStyle = '#ffffff';
    sg.fillRect(0, 0, sheet.width, sheet.height);
    // 格子形状参考：把多边形**外面**压一层很淡的灰。
    // 只看外面不改里面 —— 因为回填时会按同一个多边形裁切，外面的灰自然被裁掉，
    // 所以不需要额外图层、也不用在导出前藏起来。
    if (Array.isArray(guide) && guide.length >= 3) {
      const p = new Path2D();
      p.rect(0, 0, sheet.width, sheet.height);
      guide.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
      p.closePath();
      sg.fillStyle = 'rgba(0,0,0,0.10)';
      sg.fill(p, 'evenodd');
      // 边界再描一道细线（在边界上，导出时被裁掉一半，视觉上正好当引导线）
      sg.beginPath();
      guide.forEach(([x, y], i) => (i ? sg.lineTo(x, y) : sg.moveTo(x, y)));
      sg.closePath();
      sg.strokeStyle = 'rgba(0,0,0,0.22)';
      sg.lineWidth = Math.max(2, Math.round(sheet.width / 500));
      sg.setLineDash([Math.max(8, sheet.width / 90)]); 
      sg.stroke();
      sg.setLineDash([]);
    }
    layers.push({ name: '纸', opacity: 1, isVisible: true, image: sheet });
  }
  if (baseUrl) {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('底图读不出来'));
      i.src = baseUrl;
    });
    layers.push({ name: baseLayerName, opacity: 1, isVisible: true, image: img });
  }
  const blank = document.createElement('canvas');
  blank.width = Math.max(1, width);
  blank.height = Math.max(1, height);
  layers.push({ name: '绘制', opacity: 1, isVisible: true, image: blank });

  window.__pfKlecks = new window.Klecks({
    project: { width, height, layers },
    // Klecks 自带的「完成」会走 onSubmit，我们把它转给父页面
    onSubmit: (ok) => {
      try { ok && ok(); } catch { /* ignore */ }
      try { window.__pfOnSubmit && window.__pfOnSubmit(); } catch { /* ignore */ }
    },
  });
  document.getElementById('pf-load')?.classList.add('hide');

  // 画布默认是 100%：格子大一点就会超出视口，只看到中间一块。
  // Klecks 的自动适配只在「画布 ≤ 视口 1/4」时才触发，所以这里手动适配。
  // easel 是它内部的缩放/平移管理器（TS private，运行时可达）；改名了也只是适配失效，不影响画画。
  // 它布局完成的时间点不确定，所以前面几秒多试几次（手机上尤其要命：不定就只看到画布一角）。
  // 手机上 Klecks 本来就有「手机界面」（宽度 < collapseThreshold 时启用），但它默认把
  // 工具栏抽屉**打开**，430px 屏上画布只剩 159px。这里做两件事：
  //   1) 抽屉默认收起 —— 画布占满屏宽（430 而不是 159）
  //   2) 把它的手机工具列显式打开 —— 左边一条 36px 的竖列，笔刷/工具都能点
  // 需要完整工具栏时点左上角那个小箭头，抽屉会从左侧滑出。
  const fitMobileUi = () => {
    try {
      const app = window.__pfKlecks.embed?.klApp;
      if (!app) return false;
      if (!(app.uiWidth < app.collapseThreshold)) return true;   // 宽屏走桌面布局
      const mui = app.mobileUi;
      if (!mui) return false;
      if (mui.toolspaceIsOpen) {
        mui.toolspaceIsOpen = false;
        app.updateCollapse?.();
        window.dispatchEvent(new Event('resize'));
      }
      mui.setIsVisible?.(true);
      mui.update?.();
      // 它手机列里有两块被拉成整屏高（取色器 + 粗细/不透明度滑杆），竖屏下像两根空长条。
      // 这里统一压到屏幕高度的 22%，超出的内部滚动 —— 不依赖它那些哈希类名。
      const col = mui.controlsEl;
      if (col) {
        const cap = Math.max(64, Math.round(window.innerHeight * 0.22));
        for (const child of col.children) {
          const h = child.getBoundingClientRect().height;
          if (h > cap) {
            child.style.maxHeight = cap + 'px';
            child.style.overflowY = 'auto';
            child.style.overflowX = 'hidden';
          }
        }
      }
      return true;
    } catch { return false; }
  };

  const fit = () => {
    fitMobileUi();
    try { window.__pfKlecks.embed?.klApp?.easel?.fitTransform(true); } catch { /* ignore */ }
  };
  let tries = 0;
  const tryFit = () => {
    fit();
    if (++tries < 9) setTimeout(tryFit, 120 + tries * 160);
  };
  requestAnimationFrame(tryFit);
  window.addEventListener('resize', () => setTimeout(fit, 150));
  return true;
};

/** 取当前画面（所有可见图层合成后的 PNG，带透明通道） */
window.__pfKlecksPng = async () => {
  if (!window.__pfKlecks) throw new Error('还没初始化');
  return await window.__pfKlecks.getPNG();
};

/**
 * 白底 / 透明：切换「纸」这一层的可见性。
 * 返回**切换后纸层的实际可见性**（Klecks 的图层可能要等一帧才真正生效，
 * 调用方据此重试，而不是假设一次就成功）。
 */
window.__pfKlecksPaper = (on) => {
  try {
    const kl = window.__pfKlecks?.embed?.klApp?.klCanvas;
    if (!kl) return null;
    const find = () => (kl.getLayers?.() || []).find((l) => l.name === '纸') || null;
    const paper = find();
    if (!paper) return null;
    kl.setLayerIsVisible?.(paper.id, !!on);
    const after = find();
    return after ? !!after.isVisible : null;
  } catch { return null; }
};

/** 取分层 PSD（留着以后做「分层回填」用） */
window.__pfKlecksPsd = async () => {
  if (!window.__pfKlecks) throw new Error('还没初始化');
  return await window.__pfKlecks.getPSD();
};
</script>
</body>
</html>
